name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Real cryptography and rejection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prepare isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
      - name: Build pinned native cryptography
        run: |
          source .venv/bin/activate
          ./setup.sh
      - name: Test real handshakes and rejected attacks
        run: .venv/bin/python -m pytest --junitxml=artifacts/tests.xml
      - name: Prove the mismatch check survives optimized Python
        run: .venv/bin/python -O -m pytest tests/test_handshakes.py -k key_mismatch
      - name: Small benchmark with environment metadata
        run: .venv/bin/python src/bench.py --quick --out artifacts/smoke.csv
      - name: Upload test and benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: correctness-and-benchmark
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  security:
    uses: ./.github/workflows/security-guardrails.yml
    permissions:
      contents: read

  container:
    name: Container build and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build without publishing
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag pqc-migration-bench:ci .
      - name: Run without root privileges or network access
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges pqc-migration-bench:ci
      - name: Install verified image scanner
        run: |
          mkdir -p artifacts
          python3 scripts/install_tools.py trivy
      - name: Block high and critical image findings
        run: .tools/trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/image-vulnerabilities.json pqc-migration-bench:ci
      - name: Generate image inventory
        if: ${{ !cancelled() }}
        run: .tools/trivy image --format cyclonedx --output image-sbom.cdx.json pqc-migration-bench:ci
      - name: Upload image inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-inventory
          path: |
            image-sbom.cdx.json
            artifacts/image-vulnerabilities.json
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: Security gate
    if: ${{ always() }}
    needs: [tests, security, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$CONTAINER_RESULT" = success
